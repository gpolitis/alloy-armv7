name: Build and release

on:
  schedule:
    - cron: "17 5 * * *"   # daily: build any new upstream stable release
  workflow_dispatch:
    inputs:
      tag:
        description: "Alloy tag to build (e.g. v1.21.3). Empty = latest stable."
        required: false
      force:
        description: "Rebuild even if this release already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: |
          tag="${INPUT_TAG:-$(gh api repos/grafana/alloy/releases/latest --jq .tag_name)}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != "true" ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The Go module cache and build need well over the runner's default free space.
        run: |
          # The build image (~12 GB) plus Go's module and build caches (~18 GB) need ~30 GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell
          docker system prune -af >/dev/null
          df -h /

      - name: Build
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: ./build.sh "$TAG" dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          notes="Unofficial 32-bit ARM (armv7 / armhf) build of [Grafana Alloy $TAG](https://github.com/grafana/alloy/releases/tag/$TAG), built from the upstream tag with \`GOARCH=arm GOARM=7 CGO_ENABLED=0\`. Not supported by Grafana Labs."
          gh release delete "$TAG" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" -t "Alloy $TAG (armv7)" -n "$notes" \
            dist/alloy-linux-armv7 dist/alloy_*_armhf.deb dist/SHA256SUMS "dist/LICENSE#LICENSE (Grafana Alloy, Apache 2.0)"
